name: Build Utility IPA

'on':
  workflow_dispatch:

jobs:
  build:
    name: Compile UtilityTools
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 檢查專案檔案
      # ============================================================
      - name: Check Project Files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        PROJECT STRUCTURE"
          echo "========================================"

          find Sources AppIcon -maxdepth 4 -type f 2>/dev/null | sort || true

          echo ""
          echo "========================================"
          echo "        CHECKING REQUIRED FILES"
          echo "========================================"

          files=(
            "Sources/Main.m"

            "Sources/AppDelegate.h"
            "Sources/AppDelegate.m"

            "Sources/HomeViewController.h"
            "Sources/HomeViewController.m"

            "Sources/Helpers/UIHelpers.h"
            "Sources/Helpers/UIHelpers.m"

            "Sources/Tools/CalculatorViewController.h"
            "Sources/Tools/CalculatorViewController.m"

            "Sources/Tools/RandomViewController.h"
            "Sources/Tools/RandomViewController.m"

            "Sources/Tools/TimerViewController.h"
            "Sources/Tools/TimerViewController.m"

            "Sources/Tools/TextViewController.h"
            "Sources/Tools/TextViewController.m"

            "Sources/Tools/PasswordViewController.h"
            "Sources/Tools/PasswordViewController.m"

            "Sources/Tools/DeviceViewController.h"
            "Sources/Tools/DeviceViewController.m"

            "Sources/Tools/AboutViewController.h"
            "Sources/Tools/AboutViewController.m"

            "Info.plist"

            "AppIcon/AppIcon.png"
          )

          failed=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ MISSING: $file"
              failed=1
            fi
          done

          echo ""

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi

          echo "All required files found."


      # ============================================================
      # 3. 清理舊檔案
      # ============================================================
      - name: Clean Build
        shell: bash
        run: |
          set -e

          echo "Cleaning old build files..."

          rm -rf build
          rm -rf Payload
          rm -rf ipa_verify

          rm -f UtilityTools.ipa
          rm -f UtilityTools-unsigned.ipa

          mkdir -p build
          mkdir -p Payload

          echo "Clean build environment ready."


      # ============================================================
      # 4. 檢查 Xcode / iOS SDK
      # ============================================================
      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "             XCODE INFO"
          echo "========================================"

          xcodebuild -version

          echo ""

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "iOS SDK:"
          echo "$SDK_PATH"

          echo ""

          echo "iOS SDK Version:"
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # 5. 編譯 Objective-C
      # ============================================================
      - name: Compile UtilityTools
        shell: bash
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "========================================"
          echo "       COMPILING UTILITYTOOLS"
          echo "========================================"

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            Sources/Main.m \
            Sources/AppDelegate.m \
            Sources/HomeViewController.m \
            Sources/Tools/CalculatorViewController.m \
            Sources/Tools/RandomViewController.m \
            Sources/Tools/TimerViewController.m \
            Sources/Tools/TextViewController.m \
            Sources/Tools/PasswordViewController.m \
            Sources/Tools/DeviceViewController.m \
            Sources/Tools/AboutViewController.m \
            Sources/Helpers/UIHelpers.m \
            -I Sources \
            -I Sources/Helpers \
            -I Sources/Tools \
            -o build/UtilityTools

          chmod +x build/UtilityTools

          echo ""
          echo "Compilation successful."


      # ============================================================
      # 6. 檢查編譯出來的執行檔
      # ============================================================
      - name: Verify Compiled Binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       VERIFYING EXECUTABLE"
          echo "========================================"

          test -f build/UtilityTools

          file build/UtilityTools

          echo ""

          xcrun --sdk iphoneos \
            otool -hv \
            build/UtilityTools

          echo ""

          echo "Executable verification successful."


      # ============================================================
      # 7. 建立 UtilityTools.app
      # ============================================================
      - name: Create App Bundle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING APP BUNDLE"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          mkdir -p "$APP"

          cp \
            build/UtilityTools \
            "$APP/UtilityTools"

          cp \
            Info.plist \
            "$APP/Info.plist"

          printf 'APPL????' > "$APP/PkgInfo"

          chmod +x "$APP/UtilityTools"

          echo ""
          echo "App bundle created."

          echo ""

          find "$APP" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ============================================================
      # 8. 處理 App Icon
      # ============================================================
      - name: Prepare App Icon
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          PREPARING APP ICON"
          echo "========================================"

          APP="Payload/UtilityTools.app"
          PLIST="$APP/Info.plist"

          # ========================================================
          # 檢查原始 AppIcon
          # ========================================================

          if [ ! -f "AppIcon/AppIcon.png" ]; then
            echo "ERROR: AppIcon/AppIcon.png not found."
            exit 1
          fi

          echo "✓ Found AppIcon/AppIcon.png"

          # ========================================================
          # 顯示原始圖片尺寸
          # ========================================================

          echo ""
          echo "Original icon size:"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            AppIcon/AppIcon.png

          ORIGINAL_WIDTH=$(
            sips -g pixelWidth AppIcon/AppIcon.png \
            | tail -1 \
            | awk '{print $2}'
          )

          ORIGINAL_HEIGHT=$(
            sips -g pixelHeight AppIcon/AppIcon.png \
            | tail -1 \
            | awk '{print $2}'
          )

          echo ""
          echo "Original Width:  $ORIGINAL_WIDTH"
          echo "Original Height: $ORIGINAL_HEIGHT"

          # ========================================================
          # 自動轉成 1024x1024
          # ========================================================

          echo ""
          echo "Creating 1024x1024 icon..."

          rm -f build/AppIcon-1024.png

          sips \
            --resampleWidth 1024 \
            --resampleHeight 1024 \
            AppIcon/AppIcon.png \
            --out build/AppIcon-1024.png \
            >/dev/null

          echo "✓ Icon resized."

          # ========================================================
          # 驗證 1024x1024
          # ========================================================

          FINAL_WIDTH=$(
            sips -g pixelWidth build/AppIcon-1024.png \
            | tail -1 \
            | awk '{print $2}'
          )

          FINAL_HEIGHT=$(
            sips -g pixelHeight build/AppIcon-1024.png \
            | tail -1 \
            | awk '{print $2}'
          )

          echo ""
          echo "Final Width:  $FINAL_WIDTH"
          echo "Final Height: $FINAL_HEIGHT"

          if [ "$FINAL_WIDTH" != "1024" ] || [ "$FINAL_HEIGHT" != "1024" ]; then
            echo ""
            echo "ERROR: Failed to create 1024x1024 icon."
            exit 1
          fi

          echo "✓ Icon size is 1024x1024"


          # ========================================================
          # 建立 Assets.xcassets
          # ========================================================

          echo ""
          echo "========================================"
          echo "        CREATING ASSET CATALOG"
          echo "========================================"

          rm -rf build/Assets.xcassets

          mkdir -p \
            build/Assets.xcassets/AppIcon.appiconset

          cp \
            build/AppIcon-1024.png \
            build/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          echo "✓ AppIcon.png copied."


          # ========================================================
          # Assets.xcassets Contents.json
          # ========================================================

          printf '%s\n' \
          '{' \
          '  "info" : {' \
          '    "author" : "xcode",' \
          '    "version" : 1' \
          '  }' \
          '}' \
          > build/Assets.xcassets/Contents.json


          # ========================================================
          # AppIcon.appiconset Contents.json
          # ========================================================

          printf '%s\n' \
          '{' \
          '  "images" : [' \
          '    {' \
          '      "filename" : "AppIcon.png",' \
          '      "idiom" : "ios-marketing",' \
          '      "scale" : "1x",' \
          '      "size" : "1024x1024"' \
          '    }' \
          '  ],' \
          '  "info" : {' \
          '    "author" : "xcode",' \
          '    "version" : 1' \
          '  }' \
          '}' \
          > build/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo "✓ Assets.xcassets created."


          # ========================================================
          # 顯示 Asset Catalog
          # ========================================================

          echo ""
          echo "Asset catalog structure:"

          find build/Assets.xcassets \
            -maxdepth 3 \
            -print \
            | sort


          # ========================================================
          # 編譯 Assets.car
          # ========================================================

          echo ""
          echo "========================================"
          echo "          COMPILING ASSETS"
          echo "========================================"

          rm -rf build/CompiledAssets

          mkdir -p build/CompiledAssets

          xcrun actool \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --compile build/CompiledAssets \
            build/Assets.xcassets

          echo ""


          # ========================================================
          # 確認 Assets.car
          # ========================================================

          if [ ! -f "build/CompiledAssets/Assets.car" ]; then

            echo "ERROR: Assets.car was not generated."

            echo ""
            echo "Compiled assets:"

            find build/CompiledAssets \
              -maxdepth 3 \
              -print \
              || true

            exit 1
          fi

          echo "✓ Assets.car generated successfully."


          # ========================================================
          # 複製 Assets.car 到 App
          # ========================================================

          cp \
            build/CompiledAssets/Assets.car \
            "$APP/Assets.car"

          echo "✓ Assets.car copied to UtilityTools.app."


          # ========================================================
          # 設定 Info.plist
          # ========================================================

          echo ""
          echo "========================================"
          echo "        CONFIGURING INFO.PLIST"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons~ipad" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" \
            "$PLIST"


          # ========================================================
          # 驗證 plist
          # ========================================================

          echo ""
          echo "Checking Info.plist..."

          plutil -lint "$PLIST"

          echo ""
          echo "App Icon configuration:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$PLIST"


          # ========================================================
          # 最終確認
          # ========================================================

          echo ""
          echo "========================================"
          echo "          APP ICON READY"
          echo "========================================"

          echo ""

          echo "App bundle contents:"

          find "$APP" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo ""
          echo "✓ App Icon prepared successfully."


      # ============================================================
      # 9. 檢查 Info.plist
      # ============================================================
      - name: Verify Info.plist
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          VERIFYING INFO.PLIST"
          echo "========================================"

          PLIST="Payload/UtilityTools.app/Info.plist"

          test -f "$PLIST"

          plutil -lint "$PLIST"

          echo ""

          echo "Bundle Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo ""

          echo "Bundle Executable:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          echo ""

          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST" \
            2>/dev/null \
            || echo "CFBundleDisplayName not specified."

          echo ""

          echo "App Icon:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$PLIST"

          echo ""

          echo "Info.plist verification successful."


      # ============================================================
      # 10. 移除任何舊簽名
      # ============================================================
      - name: Remove Existing Signature
        shell: bash
        run: |
          set -e

          APP="Payload/UtilityTools.app"

          echo "Removing existing signature data..."

          rm -rf \
            "$APP/_CodeSignature"

          rm -f \
            "$APP/embedded.mobileprovision"

          echo "Existing signature information removed."


      # ============================================================
      # 11. 檢查 App Bundle
      # ============================================================
      - name: Verify App Bundle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "         VERIFYING APP BUNDLE"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          test -d "$APP"

          test -f "$APP/UtilityTools"

          test -f "$APP/Info.plist"

          test -f "$APP/PkgInfo"

          test -f "$APP/Assets.car"

          echo "✓ UtilityTools.app"
          echo "✓ UtilityTools executable"
          echo "✓ Info.plist"
          echo "✓ PkgInfo"
          echo "✓ Assets.car"

          echo ""
          echo "App bundle is valid."


      # ============================================================
      # 12. 建立 Unsigned IPA
      # ============================================================
      - name: Create Unsigned IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING UNSIGNED IPA"
          echo "========================================"

          rm -f UtilityTools-unsigned.ipa

          test -d Payload

          test -d Payload/UtilityTools.app

          cd Payload/..

          zip \
            -r \
            -q \
            UtilityTools-unsigned.ipa \
            Payload

          echo ""

          echo "Unsigned IPA created."

          ls -lh UtilityTools-unsigned.ipa


      # ============================================================
      # 13. 驗證 IPA
      # ============================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "            VERIFYING IPA"
          echo "========================================"

          test -f UtilityTools-unsigned.ipa

          echo ""
          echo "IPA size:"

          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "========================================"
          echo "            IPA CONTENTS"
          echo "========================================"

          unzip -l UtilityTools-unsigned.ipa

          echo ""
          echo "========================================"
          echo "         EXTRACTING TEST COPY"
          echo "========================================"

          rm -rf ipa_verify

          mkdir -p ipa_verify

          unzip \
            -q \
            UtilityTools-unsigned.ipa \
            -d ipa_verify

          echo ""
          echo "Checking required IPA structure..."

          test -d \
            ipa_verify/Payload

          test -d \
            ipa_verify/Payload/UtilityTools.app

          test -f \
            ipa_verify/Payload/UtilityTools.app/UtilityTools

          test -f \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          test -f \
            ipa_verify/Payload/UtilityTools.app/PkgInfo

          test -f \
            ipa_verify/Payload/UtilityTools.app/Assets.car

          echo ""
          echo "✓ Payload/"
          echo "✓ Payload/UtilityTools.app/"
          echo "✓ UtilityTools executable"
          echo "✓ Info.plist"
          echo "✓ PkgInfo"
          echo "✓ Assets.car"

          echo ""
          echo "========================================"
          echo "       APP ICON VERIFICATION"
          echo "========================================"

          echo ""
          echo "Checking Assets.car..."

          ls -lh \
            ipa_verify/Payload/UtilityTools.app/Assets.car

          echo ""
          echo "Checking Info.plist App Icon..."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          echo ""
          echo "========================================"
          echo "       IPA STRUCTURE IS VALID"
          echo "========================================"

          echo ""
          echo "Expected structure:"

          find ipa_verify \
            -maxdepth 3 \
            -print \
            | sort

          rm -rf ipa_verify


      # ============================================================
      # 14. 檢查 IPA Root Structure
      # ============================================================
      - name: Check IPA Root Structure
        shell: bash
        run: |
          set -e

          echo "Checking IPA root..."

          ROOT_CONTENT=$(unzip -Z1 \
            UtilityTools-unsigned.ipa \
            | head -1)

          echo "First entry:"
          echo "$ROOT_CONTENT"

          if [[ "$ROOT_CONTENT" != Payload/* ]]; then
            echo ""
            echo "ERROR:"
            echo "IPA does not contain Payload at root."
            exit 1
          fi

          echo ""
          echo "✓ IPA root structure is correct."


      # ============================================================
      # 15. 上傳 IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA-Unsigned
          path: UtilityTools-unsigned.ipa
          if-no-files-found: error


      # ============================================================
      # 16. Build Summary
      # ============================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "       UTILITYTOOLS BUILD COMPLETE"
          echo "========================================"

          echo ""
          echo "IPA:"
          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "Output:"
          echo "UtilityTools-unsigned.ipa"

          echo ""
          echo "IPA structure:"
          echo "Payload/"
          echo "└── UtilityTools.app/"
          echo "    ├── UtilityTools"
          echo "    ├── Info.plist"
          echo "    ├── PkgInfo"
          echo "    └── Assets.car"

          echo ""
          echo "App Icon:"
          echo "AppIcon/AppIcon.png"
          echo "        ↓"
          echo "1024x1024 AppIcon.png"
          echo "        ↓"
          echo "Assets.xcassets"
          echo "        ↓"
          echo "Assets.car"
          echo "        ↓"
          echo "UtilityTools.app"

          echo ""
          echo "Build completed successfully."
