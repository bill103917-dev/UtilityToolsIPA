name: Build Real IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arm64 IPA Directly
        run: |
          # 1. 建立 Payload/TestApp.app 目錄
          mkdir -p Payload/TestApp.app

          # 2. 建立標準 Info.plist 檔
          cat << 'EOF' > Payload/TestApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.testapp</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          EOF

          # 3. 寫入 iOS 原生程式碼
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, nil);
              }
          }
          EOF

          # 4. 直接使用 clang 編譯成 ARM64 機器碼（完全不使用 xcodebuild）
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK_PATH" -framework UIKit main.m -o Payload/TestApp.app/TestApp

          # 5. 打包成 .ipa
          zip -r RealApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: real-ipa-file
          path: RealApp.ipa
