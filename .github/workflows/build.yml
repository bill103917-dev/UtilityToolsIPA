name: Build Utility IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build App Executable & IPA
        run: |
          # 1. 建立 iOS App 資料夾結構
          mkdir -p Payload/TestApp.app

          # 2. 寫入小工具 Objective-C 程式碼 (具備 UI 與完整功能)
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          @interface ViewController : UIViewController
          @property (nonatomic, assign) NSInteger count;
          @property (nonatomic, strong) UILabel *countLabel;
          @end

          @implementation ViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"隨機抽籤與計數器";
              self.view.backgroundColor = [UIColor systemGroupedBackgroundColor];
              
              self.countLabel = [[UILabel alloc] init];
              self.countLabel.text = @"目前計數：0";
              self.countLabel.font = [UIFont systemFontOfSize:26 weight:UIFontWeightBold];
              self.countLabel.textAlignment = NSTextAlignmentCenter;
              
              UIButton *plusBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [plusBtn setTitle:@" ➕ 計數 +1 " forState:UIControlStateNormal];
              plusBtn.titleLabel.font = [UIFont systemFontOfSize:20 weight:UIFontWeightSemibold];
              plusBtn.backgroundColor = [UIColor systemBlueColor];
              [plusBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              plusBtn.layer.cornerRadius = 14;
              [plusBtn addTarget:self action:@selector(addCount) forControlEvents:UIControlEventTouchUpInside];
              
              UIButton *resetBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [resetBtn setTitle:@" 🔄 歸零 " forState:UIControlStateNormal];
              resetBtn.titleLabel.font = [UIFont systemFontOfSize:18 weight:UIFontWeightMedium];
              resetBtn.backgroundColor = [UIColor systemGray4Color];
              [resetBtn setTitleColor:[UIColor labelColor] forState:UIControlStateNormal];
              resetBtn.layer.cornerRadius = 14;
              [resetBtn addTarget:self action:@selector(resetCount) forControlEvents:UIControlEventTouchUpInside];
              
              UIButton *diceBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [diceBtn setTitle:@" 🎲 隨機抽數字 (1-100) " forState:UIControlStateNormal];
              diceBtn.titleLabel.font = [UIFont systemFontOfSize:20 weight:UIFontWeightSemibold];
              diceBtn.backgroundColor = [UIColor systemOrangeColor];
              [diceBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              diceBtn.layer.cornerRadius = 14;
              [diceBtn addTarget:self action:@selector(rollDice) forControlEvents:UIControlEventTouchUpInside];
              
              UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[self.countLabel, plusBtn, resetBtn, diceBtn]];
              stack.axis = UILayoutConstraintAxisVertical;
              stack.spacing = 16;
              stack.distribution = UIStackViewDistributionFillEqually;
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              
              [self.view addSubview:stack];
              
              [NSLayoutConstraint activateConstraints:@[
                  [stack.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [stack.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [stack.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:40],
                  [stack.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-40],
                  [stack.heightAnchor constraintEqualToConstant:280]
              ]];
          }

          - (void)addCount {
              self.count++;
              self.countLabel.text = [NSString stringWithFormat:@"目前計數：%ld", (long)self.count];
          }

          - (void)resetCount {
              self.count = 0;
              self.countLabel.text = @"目前計數：0";
          }

          - (void)rollDice {
              NSInteger num = (arc4random() % 100) + 1;
              NSString *msg = [NSString stringWithFormat:@"你抽到的數字是：%ld", (long)num];
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"🎲 抽籤結果" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"太棒了" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              ViewController *vc = [[ViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:vc];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 3. 建立標準 Info.plist 檔案
          cat << 'EOF' > Payload/TestApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.utilityapp</string>
              <key>CFBundleName</key>
              <string>實用小工具</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          EOF

          # 4. 使用 clang 編譯 iOS ARM64 機器碼並連結 UIKit 框架
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" -framework UIKit -framework Foundation main.m -o Payload/TestApp.app/TestApp

          # 5. 賦予執行權限並打包成 RealTool.ipa
          chmod +x Payload/TestApp.app/TestApp
          zip -r RealTool.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: real-tool-ipa
          path: RealTool.ipa
