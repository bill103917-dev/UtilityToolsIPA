name: Build Utility IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile UtilityTools
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check Project Files
      # ============================================================
      - name: Check Project Files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        PROJECT STRUCTURE"
          echo "========================================"

          find Sources AppIcon -maxdepth 4 -type f 2>/dev/null | sort || true

          echo ""
          echo "========================================"
          echo "        CHECKING REQUIRED FILES"
          echo "========================================"

          files=(
            "Sources/Main.m"
            "Sources/AppDelegate.h"
            "Sources/AppDelegate.m"
            "Sources/HomeViewController.h"
            "Sources/HomeViewController.m"

            "Sources/Helpers/UIHelpers.h"
            "Sources/Helpers/UIHelpers.m"

            "Sources/Tools/CalculatorViewController.h"
            "Sources/Tools/CalculatorViewController.m"

            "Sources/Tools/RandomViewController.h"
            "Sources/Tools/RandomViewController.m"

            "Sources/Tools/TimerViewController.h"
            "Sources/Tools/TimerViewController.m"

            "Sources/Tools/TextViewController.h"
            "Sources/Tools/TextViewController.m"

            "Sources/Tools/PasswordViewController.h"
            "Sources/Tools/PasswordViewController.m"

            "Sources/Tools/DeviceViewController.h"
            "Sources/Tools/DeviceViewController.m"

            "Sources/Tools/AboutViewController.h"
            "Sources/Tools/AboutViewController.m"

            "Info.plist"
            "AppIcon/AppIcon.png"
          )

          failed=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: Required files are missing."
            exit 1
          fi

          echo ""
          echo "All required files found."


      # ============================================================
      # 3. Clean
      # ============================================================
      - name: Clean Build
        shell: bash
        run: |
          set -e

          rm -rf build
          rm -rf Payload
          rm -rf ipa_verify

          rm -f UtilityTools.ipa
          rm -f UtilityTools-unsigned.ipa

          mkdir -p build
          mkdir -p Payload

          echo "Clean build environment ready."


      # ============================================================
      # 4. Check Xcode
      # ============================================================
      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "             XCODE INFO"
          echo "========================================"

          xcodebuild -version

          echo ""

          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""

          echo "iOS SDK Version:"
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # 5. Compile Objective-C
      # ============================================================
      - name: Compile UtilityTools
        shell: bash
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "========================================"
          echo "       COMPILING UTILITYTOOLS"
          echo "========================================"

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            Sources/Main.m \
            Sources/AppDelegate.m \
            Sources/HomeViewController.m \
            Sources/Tools/CalculatorViewController.m \
            Sources/Tools/RandomViewController.m \
            Sources/Tools/TimerViewController.m \
            Sources/Tools/TextViewController.m \
            Sources/Tools/PasswordViewController.m \
            Sources/Tools/DeviceViewController.m \
            Sources/Tools/AboutViewController.m \
            Sources/Helpers/UIHelpers.m \
            -I Sources \
            -I Sources/Helpers \
            -I Sources/Tools \
            -o build/UtilityTools

          chmod +x build/UtilityTools

          echo ""
          echo "Compilation successful."


      # ============================================================
      # 6. Verify Binary
      # ============================================================
      - name: Verify Compiled Binary
        shell: bash
        run: |
          set -e

          test -f build/UtilityTools

          echo "Executable:"
          file build/UtilityTools

          echo ""

          xcrun --sdk iphoneos otool -hv build/UtilityTools

          echo ""
          echo "Executable verification successful."


      # ============================================================
      # 7. Create App Bundle
      # ============================================================
      - name: Create App Bundle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING APP BUNDLE"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          mkdir -p "$APP"

          cp build/UtilityTools "$APP/UtilityTools"
          cp Info.plist "$APP/Info.plist"

          printf 'APPL????' > "$APP/PkgInfo"

          chmod +x "$APP/UtilityTools"

          echo ""
          echo "App bundle created."

          find "$APP" -maxdepth 2 -type f -print | sort


      # ============================================================
      # 8. Prepare App Icon
      # ============================================================
      - name: Prepare App Icon
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          PREPARING APP ICON"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          if [ ! -f "AppIcon/AppIcon.png" ]; then
            echo "ERROR: AppIcon/AppIcon.png not found."
            exit 1
          fi

          echo "OK: AppIcon/AppIcon.png"

          echo ""
          echo "Checking image size..."

          WIDTH=$(sips -g pixelWidth AppIcon/AppIcon.png | tail -1 | awk '{print $2}')
          HEIGHT=$(sips -g pixelHeight AppIcon/AppIcon.png | tail -1 | awk '{print $2}')

          echo "Width:  $WIDTH"
          echo "Height: $HEIGHT"

          if [ "$WIDTH" != "1024" ] || [ "$HEIGHT" != "1024" ]; then
            echo ""
            echo "ERROR: AppIcon.png must be exactly 1024x1024."
            exit 1
          fi

          echo "Icon size OK."


          # --------------------------------------------------------
          # Create asset catalog
          # --------------------------------------------------------

          rm -rf build/Assets.xcassets

          mkdir -p build/Assets.xcassets/AppIcon.appiconset

          cp \
            AppIcon/AppIcon.png \
            build/Assets.xcassets/AppIcon.appiconset/AppIcon.png


          # --------------------------------------------------------
          # Create Contents.json
          # --------------------------------------------------------

          printf '%s\n' \
          '{' \
          '  "images" : [' \
          '    {' \
          '      "filename" : "AppIcon.png",' \
          '      "idiom" : "ios-marketing",' \
          '      "scale" : "1x",' \
          '      "size" : "1024x1024"' \
          '    }' \
          '  ],' \
          '  "info" : {' \
          '    "author" : "xcode",' \
          '    "version" : 1' \
          '  }' \
          '}' \
          > build/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo ""
          echo "Asset catalog created."


          # --------------------------------------------------------
          # Compile Assets.car
          # --------------------------------------------------------

          rm -rf build/CompiledAssets
          mkdir -p build/CompiledAssets

          echo ""
          echo "Compiling Assets.car..."

          xcrun actool \
            --output-format human-readable-text \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --compile build/CompiledAssets \
            build/Assets.xcassets

          echo ""

          if [ ! -f "build/CompiledAssets/Assets.car" ]; then
            echo "ERROR: Assets.car was not generated."

            echo ""
            echo "Compiled assets:"
            find build/CompiledAssets -maxdepth 2 -print || true

            exit 1
          fi

          echo "Assets.car generated successfully."


          # --------------------------------------------------------
          # Copy Assets.car
          # --------------------------------------------------------

          cp \
            build/CompiledAssets/Assets.car \
            "$APP/Assets.car"

          echo ""
          echo "Assets.car copied to UtilityTools.app."


          # --------------------------------------------------------
          # Configure Info.plist
          # --------------------------------------------------------

          PLIST="$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons" \
            "$PLIST" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons~ipad" \
            "$PLIST" \
            2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" \
            "$PLIST"

          echo ""
          echo "========================================"
          echo "          APP ICON READY"
          echo "========================================"

          echo ""
          echo "App bundle:"
          find "$APP" -maxdepth 2 -type f -print | sort


      # ============================================================
      # 9. Verify Info.plist
      # ============================================================
      - name: Verify Info.plist
        shell: bash
        run: |
          set -e

          PLIST="Payload/UtilityTools.app/Info.plist"

          echo "========================================"
          echo "          VERIFYING INFO.PLIST"
          echo "========================================"

          test -f "$PLIST"

          plutil -lint "$PLIST"

          echo ""
          echo "Bundle Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo ""
          echo "Bundle Executable:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          echo ""
          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST" \
            2>/dev/null || true

          echo ""
          echo "App Icon:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$PLIST"

          echo ""
          echo "Info.plist verification successful."


      # ============================================================
      # 10. Remove Signature
      # ============================================================
      - name: Remove Existing Signature
        shell: bash
        run: |
          set -e

          APP="Payload/UtilityTools.app"

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          echo "Existing signature information removed."


      # ============================================================
      # 11. Verify App Bundle
      # ============================================================
      - name: Verify App Bundle
        shell: bash
        run: |
          set -e

          APP="Payload/UtilityTools.app"

          echo "========================================"
          echo "         VERIFYING APP BUNDLE"
          echo "========================================"

          test -d "$APP"
          test -f "$APP/UtilityTools"
          test -f "$APP/Info.plist"
          test -f "$APP/PkgInfo"
          test -f "$APP/Assets.car"

          echo "OK: UtilityTools.app"
          echo "OK: UtilityTools executable"
          echo "OK: Info.plist"
          echo "OK: PkgInfo"
          echo "OK: Assets.car"

          echo ""
          echo "App bundle is valid."


      # ============================================================
      # 12. Create IPA
      # ============================================================
      - name: Create Unsigned IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING UNSIGNED IPA"
          echo "========================================"

          rm -f UtilityTools-unsigned.ipa

          test -d Payload
          test -d Payload/UtilityTools.app

          zip \
            -r \
            -q \
            UtilityTools-unsigned.ipa \
            Payload

          echo ""
          echo "Unsigned IPA created."

          ls -lh UtilityTools-unsigned.ipa


      # ============================================================
      # 13. Verify IPA
      # ============================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "            VERIFYING IPA"
          echo "========================================"

          test -f UtilityTools-unsigned.ipa

          echo ""
          echo "IPA size:"
          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "IPA contents:"
          unzip -l UtilityTools-unsigned.ipa

          echo ""
          echo "Extracting test copy..."

          rm -rf ipa_verify
          mkdir -p ipa_verify

          unzip \
            -q \
            UtilityTools-unsigned.ipa \
            -d ipa_verify

          echo ""
          echo "Checking structure..."

          test -d ipa_verify/Payload
          test -d ipa_verify/Payload/UtilityTools.app

          test -f ipa_verify/Payload/UtilityTools.app/UtilityTools
          test -f ipa_verify/Payload/UtilityTools.app/Info.plist
          test -f ipa_verify/Payload/UtilityTools.app/PkgInfo
          test -f ipa_verify/Payload/UtilityTools.app/Assets.car

          echo ""
          echo "OK: Payload/"
          echo "OK: UtilityTools.app/"
          echo "OK: executable"
          echo "OK: Info.plist"
          echo "OK: PkgInfo"
          echo "OK: Assets.car"

          echo ""
          echo "========================================"
          echo "       APP ICON VERIFICATION"
          echo "========================================"

          ls -lh \
            ipa_verify/Payload/UtilityTools.app/Assets.car

          echo ""

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          echo ""
          echo "IPA structure is valid."

          rm -rf ipa_verify


      # ============================================================
      # 14. Check IPA Root
      # ============================================================
      - name: Check IPA Root Structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CHECKING IPA ROOT"
          echo "========================================"

          ROOT_CONTENT=$(unzip -Z1 UtilityTools-unsigned.ipa | head -1)

          echo "First entry:"
          echo "$ROOT_CONTENT"

          case "$ROOT_CONTENT" in
            Payload/*)
              echo ""
              echo "OK: Payload is at IPA root."
              ;;
            *)
              echo ""
              echo "ERROR: Payload is not at IPA root."
              exit 1
              ;;
          esac


      # ============================================================
      # 15. Upload IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA-Unsigned
          path: UtilityTools-unsigned.ipa
          if-no-files-found: error


      # ============================================================
      # 16. Build Summary
      # ============================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "       UTILITYTOOLS BUILD COMPLETE"
          echo "========================================"

          echo ""
          echo "IPA:"
          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "Output:"
          echo "UtilityTools-unsigned.ipa"

          echo ""
          echo "IPA structure:"
          echo "Payload/"
          echo "└── UtilityTools.app/"
          echo "    ├── UtilityTools"
          echo "    ├── Info.plist"
          echo "    ├── PkgInfo"
          echo "    └── Assets.car"

          echo ""
          echo "App Icon:"
          echo "AppIcon/AppIcon.png"
          echo "        ↓"
          echo "Assets.xcassets"
          echo "        ↓"
          echo "AppIcon.appiconset"
          echo "        ↓"
          echo "Assets.car"
          echo "        ↓"
          echo "UtilityTools.app"

          echo ""
          echo "Build completed successfully."
