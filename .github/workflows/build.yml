name: Build Utility IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile UtilityTools
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 檢查專案檔案
      # ============================================================
      - name: Check Project Files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        PROJECT STRUCTURE"
          echo "========================================"

          find Sources AppIcon -maxdepth 4 -type f 2>/dev/null | sort || true

          echo ""
          echo "========================================"
          echo "        CHECKING REQUIRED FILES"
          echo "========================================"

          files=(
            "Sources/Main.m"

            "Sources/AppDelegate.h"
            "Sources/AppDelegate.m"

            "Sources/HomeViewController.h"
            "Sources/HomeViewController.m"

            "Sources/Helpers/UIHelpers.h"
            "Sources/Helpers/UIHelpers.m"

            "Sources/Tools/CalculatorViewController.h"
            "Sources/Tools/CalculatorViewController.m"

            "Sources/Tools/RandomViewController.h"
            "Sources/Tools/RandomViewController.m"

            "Sources/Tools/TimerViewController.h"
            "Sources/Tools/TimerViewController.m"

            "Sources/Tools/TextViewController.h"
            "Sources/Tools/TextViewController.m"

            "Sources/Tools/PasswordViewController.h"
            "Sources/Tools/PasswordViewController.m"

            "Sources/Tools/DeviceViewController.h"
            "Sources/Tools/DeviceViewController.m"

            "Sources/Tools/AboutViewController.h"
            "Sources/Tools/AboutViewController.m"

            "Info.plist"

            "AppIcon/AppIcon.png"
          )

          failed=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ MISSING: $file"
              failed=1
            fi
          done

          echo ""

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi

          echo "✓ All required files found."


      # ============================================================
      # 3. 清理舊檔案
      # ============================================================
      - name: Clean Build Environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       CLEAN BUILD ENVIRONMENT"
          echo "========================================"

          rm -rf build
          rm -rf Payload
          rm -rf ipa_verify

          rm -f UtilityTools.ipa
          rm -f UtilityTools-unsigned.ipa

          mkdir -p build
          mkdir -p Payload

          echo "✓ Build environment cleaned."


      # ============================================================
      # 4. Xcode / iOS SDK
      # ============================================================
      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "             XCODE INFO"
          echo "========================================"

          xcodebuild -version

          echo ""

          echo "iOS SDK Path:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""

          echo "iOS SDK Version:"
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # 5. 編譯 Objective-C
      # ============================================================
      - name: Compile UtilityTools
        shell: bash
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "========================================"
          echo "       COMPILING UTILITYTOOLS"
          echo "========================================"

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            Sources/Main.m \
            Sources/AppDelegate.m \
            Sources/HomeViewController.m \
            Sources/Tools/CalculatorViewController.m \
            Sources/Tools/RandomViewController.m \
            Sources/Tools/TimerViewController.m \
            Sources/Tools/TextViewController.m \
            Sources/Tools/PasswordViewController.m \
            Sources/Tools/DeviceViewController.m \
            Sources/Tools/AboutViewController.m \
            Sources/Helpers/UIHelpers.m \
            -I Sources \
            -I Sources/Helpers \
            -I Sources/Tools \
            -o build/UtilityTools

          chmod +x build/UtilityTools

          echo ""
          echo "✓ Compilation successful."


      # ============================================================
      # 6. 驗證執行檔
      # ============================================================
      - name: Verify Compiled Binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       VERIFYING EXECUTABLE"
          echo "========================================"

          test -f build/UtilityTools

          echo "Executable:"
          file build/UtilityTools

          echo ""

          echo "Mach-O Header:"

          xcrun --sdk iphoneos \
            otool -hv \
            build/UtilityTools

          echo ""
          echo "✓ Executable verification successful."


      # ============================================================
      # 7. 建立 App Bundle
      # ============================================================
      - name: Create App Bundle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING APP BUNDLE"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          mkdir -p "$APP"

          cp \
            build/UtilityTools \
            "$APP/UtilityTools"

          cp \
            Info.plist \
            "$APP/Info.plist"

          printf 'APPL????' > "$APP/PkgInfo"

          chmod +x \
            "$APP/UtilityTools"

          echo ""
          echo "✓ App bundle created."

          echo ""

          find "$APP" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ============================================================
      # 8. 處理 App Icon
      # ============================================================
      - name: Prepare App Icon
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          PREPARING APP ICON"
          echo "========================================"

          APP="Payload/UtilityTools.app"
          PLIST="$APP/Info.plist"

          ICON_SOURCE="AppIcon/AppIcon.png"
          ICON_OUTPUT="build/AppIcon-1024.png"

          # ========================================================
          # 檢查 Icon
          # ========================================================

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: $ICON_SOURCE not found."
            exit 1
          fi

          echo "✓ Found $ICON_SOURCE"


          # ========================================================
          # 顯示原始尺寸
          # ========================================================

          echo ""
          echo "Original icon size:"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            "$ICON_SOURCE"


          # ========================================================
          # 建立 1024x1024 Icon
          # ========================================================

          echo ""
          echo "Creating 1024x1024 AppIcon..."

          rm -f "$ICON_OUTPUT"

          cp \
            "$ICON_SOURCE" \
            "$ICON_OUTPUT"

          sips \
            -z 1024 1024 \
            "$ICON_OUTPUT" \
            >/dev/null


          # ========================================================
          # 驗證 Icon
          # ========================================================

          echo ""
          echo "Final icon size:"

          sips \
            -g pixelWidth \
            -g pixelHeight \
            "$ICON_OUTPUT"

          FINAL_WIDTH=$(
            sips \
              -g pixelWidth \
              "$ICON_OUTPUT" \
              | awk '/pixelWidth:/ {print $2}'
          )

          FINAL_HEIGHT=$(
            sips \
              -g pixelHeight \
              "$ICON_OUTPUT" \
              | awk '/pixelHeight:/ {print $2}'
          )

          echo ""
          echo "Final Width:  $FINAL_WIDTH"
          echo "Final Height: $FINAL_HEIGHT"

          if [ "$FINAL_WIDTH" != "1024" ] || [ "$FINAL_HEIGHT" != "1024" ]; then
            echo ""
            echo "ERROR: AppIcon is not 1024x1024."
            exit 1
          fi

          echo ""
          echo "✓ AppIcon is exactly 1024x1024."


          # ========================================================
          # 建立 Assets.xcassets
          # ========================================================

          echo ""
          echo "========================================"
          echo "       CREATING ASSET CATALOG"
          echo "========================================"

          rm -rf build/Assets.xcassets

          mkdir -p \
            build/Assets.xcassets/AppIcon.appiconset


          # ========================================================
          # 複製 Icon
          # ========================================================

          cp \
            "$ICON_OUTPUT" \
            build/Assets.xcassets/AppIcon.appiconset/AppIcon.png


          # ========================================================
          # Assets.xcassets Contents.json
          # ========================================================

          printf '%s\n' \
            '{' \
            '  "info" : {' \
            '    "author" : "xcode",' \
            '    "version" : 1' \
            '  }' \
            '}' \
            > build/Assets.xcassets/Contents.json


          # ========================================================
          # AppIcon.appiconset Contents.json
          # ========================================================

          printf '%s\n' \
            '{' \
            '  "images" : [' \
            '    {' \
            '      "filename" : "AppIcon.png",' \
            '      "idiom" : "iphone",' \
            '      "scale" : "2x",' \
            '      "size" : "60x60"' \
            '    },' \
            '    {' \
            '      "filename" : "AppIcon.png",' \
            '      "idiom" : "iphone",' \
            '      "scale" : "3x",' \
            '      "size" : "60x60"' \
            '    },' \
            '    {' \
            '      "filename" : "AppIcon.png",' \
            '      "idiom" : "ipad",' \
            '      "scale" : "2x",' \
            '      "size" : "76x76"' \
            '    },' \
            '    {' \
            '      "filename" : "AppIcon.png",' \
            '      "idiom" : "ipad",' \
            '      "scale" : "2x",' \
            '      "size" : "83.5x83.5"' \
            '    },' \
            '    {' \
            '      "filename" : "AppIcon.png",' \
            '      "idiom" : "ios-marketing",' \
            '      "scale" : "1x",' \
            '      "size" : "1024x1024"' \
            '    }' \
            '  ],' \
            '  "info" : {' \
            '    "author" : "xcode",' \
            '    "version" : 1' \
            '  }' \
            '}' \
            > build/Assets.xcassets/AppIcon.appiconset/Contents.json


          echo ""
          echo "✓ Assets.xcassets created."


          # ========================================================
          # 顯示 Asset Catalog
          # ========================================================

          echo ""
          echo "Asset catalog files:"

          find build/Assets.xcassets \
            -maxdepth 3 \
            -type f \
            -print \
            | sort


          # ========================================================
          # 編譯 Assets.car
          # ========================================================

          echo ""
          echo "========================================"
          echo "          COMPILING ASSETS"
          echo "========================================"

          rm -rf build/CompiledAssets

          mkdir -p build/CompiledAssets

          rm -f build/asset-partial-info.plist

          xcrun actool \
            --output-format human-readable-text \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/asset-partial-info.plist \
            --compile build/CompiledAssets \
            build/Assets.xcassets


          # ========================================================
          # 確認 Assets.car
          # ========================================================

          echo ""

          if [ ! -f "build/CompiledAssets/Assets.car" ]; then
            echo "ERROR: Assets.car was not generated."

            echo ""
            echo "Compiled assets:"
            find build/CompiledAssets \
              -maxdepth 3 \
              -print \
              || true

            echo ""
            echo "Partial plist:"

            if [ -f "build/asset-partial-info.plist" ]; then
              cat build/asset-partial-info.plist
            fi

            exit 1
          fi

          echo "✓ Assets.car generated successfully."


          # ========================================================
          # 複製 Assets.car
          # ========================================================

          cp \
            build/CompiledAssets/Assets.car \
            "$APP/Assets.car"

          echo "✓ Assets.car copied to UtilityTools.app."


          # ========================================================
          # 設定 Info.plist
          # ========================================================

          echo ""
          echo "========================================"
          echo "        CONFIGURING INFO.PLIST"
          echo "========================================"


          # --------------------------------------------------------
          # 移除舊 Icon 設定
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIcons~ipad" \
            "$PLIST" \
            2>/dev/null \
            || true

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIconName" \
            "$PLIST" \
            2>/dev/null \
            || true


          # --------------------------------------------------------
          # CFBundleIconName
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIconName string AppIcon" \
            "$PLIST"


          # --------------------------------------------------------
          # iPhone Icon
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" \
            "$PLIST"


          # --------------------------------------------------------
          # iPad Icon
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons~ipad dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" \
            "$PLIST"


          echo ""
          echo "✓ Info.plist configured."


          # ========================================================
          # 顯示最後結果
          # ========================================================

          echo ""
          echo "========================================"
          echo "          APP ICON READY"
          echo "========================================"

          echo ""
          echo "App bundle contents:"

          find "$APP" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ============================================================
      # 9. 驗證 Info.plist
      # ============================================================
      - name: Verify Info.plist
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          VERIFYING INFO.PLIST"
          echo "========================================"

          PLIST="Payload/UtilityTools.app/Info.plist"

          test -f "$PLIST"

          plutil -lint "$PLIST"

          echo ""
          echo "Bundle Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo ""
          echo "Bundle Executable:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          echo ""
          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST" \
            2>/dev/null \
            || echo "CFBundleDisplayName not specified."

          echo ""
          echo "CFBundleIconName:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIconName" \
            "$PLIST"

          echo ""
          echo "CFBundleIcons:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$PLIST"

          echo ""
          echo "CFBundleIcons~ipad:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons~ipad" \
            "$PLIST"

          echo ""
          echo "✓ Info.plist verification successful."


      # ============================================================
      # 10. 驗證 Assets.car
      # ============================================================
      - name: Verify Assets Catalog
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       VERIFYING ASSET CATALOG"
          echo "========================================"

          APP="Payload/UtilityTools.app"
          ASSETS="$APP/Assets.car"

          test -f "$ASSETS"

          echo ""
          echo "Assets.car:"
          ls -lh "$ASSETS"

          echo ""
          echo "Asset catalog information:"

          xcrun assetutil \
            --info \
            "$ASSETS" \
            > build/assets-info.json

          test -s build/assets-info.json

          echo ""
          echo "Searching for AppIcon metadata:"

          if grep -q "AppIcon" build/assets-info.json; then
            echo "✓ AppIcon found inside Assets.car."
          else
            echo "WARNING: AppIcon text was not found in assetutil output."
            echo ""
            echo "First 100 lines of asset information:"
            head -100 build/assets-info.json
          fi

          echo ""
          echo "✓ Assets.car verification completed."


      # ============================================================
      # 11. 移除舊簽名
      # ============================================================
      - name: Remove Existing Signature
        shell: bash
        run: |
          set -e

          APP="Payload/UtilityTools.app"

          echo "========================================"
          echo "       REMOVING OLD SIGNATURE"
          echo "========================================"

          rm -rf \
            "$APP/_CodeSignature"

          rm -f \
            "$APP/embedded.mobileprovision"

          echo "✓ Existing signature information removed."


      # ============================================================
      # 12. 驗證 App Bundle
      # ============================================================
      - name: Verify App Bundle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "         VERIFYING APP BUNDLE"
          echo "========================================"

          APP="Payload/UtilityTools.app"

          test -d "$APP"

          test -f "$APP/UtilityTools"
          test -f "$APP/Info.plist"
          test -f "$APP/PkgInfo"
          test -f "$APP/Assets.car"

          echo "✓ UtilityTools.app"
          echo "✓ UtilityTools executable"
          echo "✓ Info.plist"
          echo "✓ PkgInfo"
          echo "✓ Assets.car"

          echo ""
          echo "✓ App bundle is valid."


      # ============================================================
      # 13. 建立 Unsigned IPA
      # ============================================================
      - name: Create Unsigned IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          CREATING UNSIGNED IPA"
          echo "========================================"

          rm -f UtilityTools-unsigned.ipa

          test -d Payload
          test -d Payload/UtilityTools.app

          zip \
            -r \
            -q \
            UtilityTools-unsigned.ipa \
            Payload

          echo ""
          echo "✓ Unsigned IPA created."

          ls -lh UtilityTools-unsigned.ipa


      # ============================================================
      # 14. 驗證 IPA
      # ============================================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "            VERIFYING IPA"
          echo "========================================"

          test -f UtilityTools-unsigned.ipa

          echo ""
          echo "IPA size:"
          ls -lh UtilityTools-unsigned.ipa


          # ========================================================
          # 顯示 IPA Contents
          # ========================================================

          echo ""
          echo "========================================"
          echo "            IPA CONTENTS"
          echo "========================================"

          unzip -l UtilityTools-unsigned.ipa


          # ========================================================
          # 解壓縮測試
          # ========================================================

          echo ""
          echo "========================================"
          echo "         EXTRACTING TEST COPY"
          echo "========================================"

          rm -rf ipa_verify

          mkdir -p ipa_verify

          unzip \
            -q \
            UtilityTools-unsigned.ipa \
            -d ipa_verify


          # ========================================================
          # 檢查 Payload
          # ========================================================

          echo ""
          echo "Checking required IPA structure..."

          test -d \
            ipa_verify/Payload

          test -d \
            ipa_verify/Payload/UtilityTools.app

          test -f \
            ipa_verify/Payload/UtilityTools.app/UtilityTools

          test -f \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          test -f \
            ipa_verify/Payload/UtilityTools.app/PkgInfo

          test -f \
            ipa_verify/Payload/UtilityTools.app/Assets.car


          echo ""
          echo "✓ Payload/"
          echo "✓ Payload/UtilityTools.app/"
          echo "✓ UtilityTools executable"
          echo "✓ Info.plist"
          echo "✓ PkgInfo"
          echo "✓ Assets.car"


          # ========================================================
          # App Icon Verification
          # ========================================================

          echo ""
          echo "========================================"
          echo "       APP ICON VERIFICATION"
          echo "========================================"

          echo ""
          echo "Assets.car:"

          ls -lh \
            ipa_verify/Payload/UtilityTools.app/Assets.car

          echo ""
          echo "CFBundleIconName:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIconName" \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          echo ""
          echo "CFBundleIcons:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            ipa_verify/Payload/UtilityTools.app/Info.plist

          echo ""
          echo "CFBundleIcons~ipad:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons~ipad" \
            ipa_verify/Payload/UtilityTools.app/Info.plist


          echo ""
          echo "========================================"
          echo "       IPA STRUCTURE IS VALID"
          echo "========================================"


          # ========================================================
          # 顯示結構
          # ========================================================

          echo ""
          echo "IPA structure:"

          find ipa_verify \
            -maxdepth 3 \
            -print \
            | sort

          rm -rf ipa_verify


      # ============================================================
      # 15. 檢查 IPA Root
      # ============================================================
      - name: Check IPA Root Structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       CHECKING IPA ROOT STRUCTURE"
          echo "========================================"

          ROOT_CONTENT=$(
            unzip -Z1 \
              UtilityTools-unsigned.ipa \
              | head -1
          )

          echo "First entry:"
          echo "$ROOT_CONTENT"

          if [[ "$ROOT_CONTENT" != Payload/* ]]; then
            echo ""
            echo "ERROR:"
            echo "IPA does not contain Payload at root."
            exit 1
          fi

          echo ""
          echo "✓ IPA root structure is correct."


      # ============================================================
      # 16. 上傳 IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA-Unsigned
          path: UtilityTools-unsigned.ipa
          if-no-files-found: error


      # ============================================================
      # 17. Build Summary
      # ============================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "       UTILITYTOOLS BUILD COMPLETE"
          echo "========================================"

          echo ""
          echo "IPA:"
          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "Output:"
          echo "UtilityTools-unsigned.ipa"

          echo ""
          echo "IPA structure:"
          echo "Payload/"
          echo "└── UtilityTools.app/"
          echo "    ├── UtilityTools"
          echo "    ├── Info.plist"
          echo "    ├── PkgInfo"
          echo "    └── Assets.car"

          echo ""
          echo "App Icon:"
          echo "AppIcon/AppIcon.png"
          echo "        ↓"
          echo "1024x1024 AppIcon"
          echo "        ↓"
          echo "Assets.xcassets"
          echo "        ↓"
          echo "Assets.car"
          echo "        ↓"
          echo "UtilityTools.app"

          echo ""
          echo "Signing:"
          echo "UNSIGNED - ready for your own signing process"

          echo ""
          echo "========================================"
          echo "          BUILD SUCCESS"
          echo "========================================"
