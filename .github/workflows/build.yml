name: Build Real IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create & Compile SwiftUI App
        run: |
          # 1. 建立 Swift 原始碼
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.swift
          import SwiftUI

          @main
          struct TestApp: App {
              var body: some Scene {
                  WindowGroup {
                      Text("Hello, iPhone!")
                          .font(.largeTitle)
                          .padding()
                  }
              }
          }
          EOF

          # 2. 建立 Info.plist
          cat << 'EOF' > AppSource/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.realtestapp</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 3. 使用 swiftc 編譯真實的 arm64 執行檔
          mkdir -p Payload/TestApp.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -target arm64-apple-ios15.0 -sdk $SDK_PATH AppSource/main.swift -o Payload/TestApp.app/TestApp
          cp AppSource/Info.plist Payload/TestApp.app/

          # 4. 打包成 .ipa
          zip -r RealApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: real-ipa-file
          path: RealApp.ipa
