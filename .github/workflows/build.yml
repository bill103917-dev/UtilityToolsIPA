name: Build Utility IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile UtilityTools
    runs-on: macos-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 檢查專案檔案
      - name: Check Project Files
        shell: bash
        run: |
          set -e

          echo "===== PROJECT STRUCTURE ====="
          find Sources AppIcon -maxdepth 4 -type f 2>/dev/null | sort || true

          echo ""
          echo "===== CHECKING FILES ====="

          files=(
            "Sources/Main.m"
            "Sources/AppDelegate.h"
            "Sources/AppDelegate.m"
            "Sources/HomeViewController.h"
            "Sources/HomeViewController.m"

            "Sources/Helpers/UIHelpers.h"
            "Sources/Helpers/UIHelpers.m"

            "Sources/Tools/CalculatorViewController.h"
            "Sources/Tools/CalculatorViewController.m"

            "Sources/Tools/RandomViewController.h"
            "Sources/Tools/RandomViewController.m"

            "Sources/Tools/TimerViewController.h"
            "Sources/Tools/TimerViewController.m"

            "Sources/Tools/TextViewController.h"
            "Sources/Tools/TextViewController.m"

            "Sources/Tools/PasswordViewController.h"
            "Sources/Tools/PasswordViewController.m"

            "Sources/Tools/DeviceViewController.h"
            "Sources/Tools/DeviceViewController.m"

            "Sources/Tools/AboutViewController.h"
            "Sources/Tools/AboutViewController.m"

            "Info.plist"
          )

          failed=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ MISSING: $file"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: Required files are missing."
            exit 1
          fi

          echo ""
          echo "All required files found."

      # 3. 清理
      - name: Clean Build
        shell: bash
        run: |
          set -e

          rm -rf build
          rm -rf Payload
          rm -f UtilityTools.ipa

          mkdir -p build
          mkdir -p Payload/UtilityTools.app

          echo "Build folders created."

      # 4. 取得 iOS SDK
      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "iOS SDK:"
          echo "$SDK_PATH"

          xcrun --sdk iphoneos --show-sdk-version

      # 5. 編譯
      - name: Compile UtilityTools
        shell: bash
        run: |
          set -e

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "Compiling UtilityTools..."

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            Sources/Main.m \
            Sources/AppDelegate.m \
            Sources/HomeViewController.m \
            Sources/Tools/CalculatorViewController.m \
            Sources/Tools/RandomViewController.m \
            Sources/Tools/TimerViewController.m \
            Sources/Tools/TextViewController.m \
            Sources/Tools/PasswordViewController.m \
            Sources/Tools/DeviceViewController.m \
            Sources/Tools/AboutViewController.m \
            Sources/Helpers/UIHelpers.m \
            -I Sources \
            -I Sources/Helpers \
            -I Sources/Tools \
            -o build/UtilityTools

          chmod +x build/UtilityTools

          echo ""
          echo "Compilation successful."

      # 6. 建立 App Bundle
      - name: Create App Bundle
        shell: bash
        run: |
          set -e

          APP="Payload/UtilityTools.app"

          cp build/UtilityTools "$APP/UtilityTools"
          cp Info.plist "$APP/Info.plist"

          printf 'APPL????' > "$APP/PkgInfo"

          echo "App bundle:"
          find "$APP" -maxdepth 2 -type f | sort

      # 7. 檢查 Mach-O
      - name: Verify Executable
        shell: bash
        run: |
          set -e

          file Payload/UtilityTools.app/UtilityTools

          xcrun --sdk iphoneos \
            otool -hv \
            Payload/UtilityTools.app/UtilityTools

          echo "Executable verification successful."

      # 8. 處理 App Icon
      - name: Prepare App Icon
        shell: bash
        run: |
          set -e

          if [ -d "AppIcon.appiconset" ]; then
            cp -R AppIcon.appiconset \
              Payload/UtilityTools.app/

            echo "AppIcon.appiconset copied."

          elif [ -f "AppIcon/AppIcon.jpeg" ]; then
            echo "AppIcon.jpeg found."
            echo "Custom icon will be configured in a later version."

          else
            echo "No custom App Icon found."
          fi

      # 9. 檢查 Info.plist
      - name: Verify Info.plist
        shell: bash
        run: |
          set -e

          plutil -lint \
            Payload/UtilityTools.app/Info.plist

          echo ""
          echo "Bundle information:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            Payload/UtilityTools.app/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            Payload/UtilityTools.app/Info.plist

          echo ""
          echo "Info.plist verification successful."

      # 10. 移除舊簽名資訊
      - name: Remove Existing Signature
        shell: bash
        run: |
          set -e

          rm -rf \
            Payload/UtilityTools.app/_CodeSignature

          echo "Existing signature information removed."

      # 11. 建立未簽名 IPA
      - name: Create Unsigned IPA
        shell: bash
        run: |
          set -e

          cd Payload

          zip \
            -r \
            -q \
            ../UtilityTools-unsigned.ipa \
            UtilityTools.app

          cd ..

          echo "Unsigned IPA created."

      # 12. 檢查 IPA
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          test -f UtilityTools-unsigned.ipa

          echo "===== IPA INFORMATION ====="

          ls -lh UtilityTools-unsigned.ipa

          echo ""
          echo "===== IPA CONTENTS ====="

          unzip -l UtilityTools-unsigned.ipa

          echo ""
          echo "IPA verification successful."

      # 13. 上傳 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA-Unsigned
          path: UtilityTools-unsigned.ipa
          if-no-files-found: error
