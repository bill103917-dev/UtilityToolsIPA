name: Build Utility IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile UtilityTools
    runs-on: macos-latest

    steps:

      # 1. 下載 Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 檢查檔案     
      - name: Check Project Files
        run: |
          echo "===== PROJECT STRUCTURE ====="

          find . -maxdepth 4 -type f | sort

          echo ""
          echo "===== CHECKING FILES ====="

          files=(
            "Sources/Main.m"
            "Sources/AppDelegate.h"
            "Sources/AppDelegate.m"
            "Sources/HomeViewController.h"
            "Sources/HomeViewController.m"
            "Sources/Helpers/UIHelpers.h"
            "Sources/Helpers/UIHelpers.m"
            "Sources/Tools/CalculatorViewController.h"
            "Sources/Tools/CalculatorViewController.m"
            "Sources/Tools/RandomViewController.h"
            "Sources/Tools/RandomViewController.m"
            "Sources/Tools/TimerViewController.h"
            "Sources/Tools/TimerViewController.m"
            "Sources/Tools/TextViewController.h"
            "Sources/Tools/TextViewController.m"
            "Sources/Tools/PasswordViewController.h"
            "Sources/Tools/PasswordViewController.m"
            "Sources/Tools/DeviceViewController.h"
            "Sources/Tools/DeviceViewController.m"
            "Sources/Tools/AboutViewController.h"
            "Sources/Tools/AboutViewController.m"
            "Info.plist"
          )

          failed=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ MISSING: $file"
              failed=1
            fi
          done

          echo ""

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi

          echo "All required files found."

      # 3. 清理舊檔案
      - name: Clean Build
        run: |
          rm -rf build
          rm -rf Payload
          rm -f UtilityTools.ipa

          mkdir -p build
          mkdir -p Payload

      # 4. 編譯 Objective-C
      - name: Compile UtilityTools
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "iOS SDK:"
          echo "$SDK_PATH"

          clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            Sources/Main.m \
            Sources/AppDelegate.m \
            Sources/HomeViewController.m \
            Sources/Tools/CalculatorViewController.m \
            Sources/Tools/RandomViewController.m \
            Sources/Tools/TimerViewController.m \
            Sources/Tools/TextViewController.m \
            Sources/Tools/PasswordViewController.m \
            Sources/Tools/DeviceViewController.m \
            Sources/Tools/AboutViewController.m \
            Sources/Helpers/UIHelpers.m \
            -I Sources \
            -I Sources/Helpers \
            -I Sources/Tools \
            -o build/UtilityTools

          chmod +x build/UtilityTools

          echo "Compilation successful."

      # 5. 建立 .app
      - name: Create App Bundle
        run: |
          mkdir -p Payload/UtilityTools.app

          cp build/UtilityTools \
            Payload/UtilityTools.app/UtilityTools

          cp Info.plist \
            Payload/UtilityTools.app/Info.plist

          printf 'APPL????' \
            > Payload/UtilityTools.app/PkgInfo

          echo "App bundle created."

      # 6. 複製 App Icon
      - name: Copy App Icon
        run: |
          if [ -d "AppIcon.appiconset" ]; then

            cp -R AppIcon.appiconset \
              Payload/UtilityTools.app/

            echo "App icon copied."

          else

            echo "No AppIcon.appiconset found."
            echo "Continuing without custom icon."

          fi

      # 7. 程式碼簽名
      - name: Sign Application
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            Payload/UtilityTools.app

          codesign \
            --verify \
            --deep \
            --strict \
            Payload/UtilityTools.app

          echo "Code signing successful."

      # 8. 建立 IPA
      - name: Create IPA
        run: |
          cd Payload

          zip \
            -r \
            -q \
            ../UtilityTools.ipa \
            UtilityTools.app

          cd ..

          echo "IPA created successfully."

      # 9. 檢查 IPA
      - name: Verify IPA
        run: |
          test -f UtilityTools.ipa

          echo "IPA information:"
          ls -lh UtilityTools.ipa

          echo ""
          echo "IPA contents:"
          unzip -l UtilityTools.ipa

          echo ""
          echo "IPA verification successful."

      # 10. 上傳 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA
          path: UtilityTools.ipa
          if-no-files-found: error
