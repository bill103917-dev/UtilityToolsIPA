name: Build Utility IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Utility Tools IPA
    runs-on: macos-latest

    steps:

      # ==========================================
      # 1. 取得 Repository
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. 顯示環境
      # ==========================================

      - name: Show Build Environment
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version


      # ==========================================
      # 3. 清理舊檔案
      # ==========================================

      - name: Clean
        run: |
          rm -rf Payload
          rm -rf UtilityTools.ipa
          rm -rf build
          rm -f main.o

          mkdir -p Payload/UtilityTools.app


      # ==========================================
      # 4. 建立 Info.plist
      # ==========================================

      - name: Create Info.plist
        run: |
          cat > Payload/UtilityTools.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>CFBundleDevelopmentRegion</key>
              <string>zh_TW</string>

              <key>CFBundleDisplayName</key>
              <string>Utility Tools</string>

              <key>CFBundleExecutable</key>
              <string>UtilityTools</string>

              <key>CFBundleIdentifier</key>
              <string>com.utilitytools.app</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>UtilityTools</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>MinimumOSVersion</key>
              <string>15.0</string>

              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

          </dict>
          </plist>
          PLIST


      # ==========================================
      # 5. 檢查 Info.plist
      # ==========================================

      - name: Validate Info.plist
        run: |
          plutil -lint Payload/UtilityTools.app/Info.plist

          plutil -p Payload/UtilityTools.app/Info.plist


      # ==========================================
      # 6. 建立 PkgInfo
      # ==========================================

      - name: Create PkgInfo
        run: |
          printf 'APPL????' > Payload/UtilityTools.app/PkgInfo


      # ==========================================
      # 7. 檢查 main.m
      # ==========================================

      - name: Check Source
        run: |
          test -f main.m

          echo "Source file:"
          wc -l main.m


      # ==========================================
      # 8. 編譯 iOS App
      # ==========================================

      - name: Compile UtilityTools
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          echo "Using SDK:"
          echo "$SDK_PATH"

          xcrun clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -Wall \
            -Wextra \
            main.m \
            -framework UIKit \
            -framework Foundation \
            -o Payload/UtilityTools.app/UtilityTools


      # ==========================================
      # 9. 確認 Executable
      # ==========================================

      - name: Validate Executable
        run: |
          test -f Payload/UtilityTools.app/UtilityTools
          test -x Payload/UtilityTools.app/UtilityTools

          echo "Executable exists."

          file Payload/UtilityTools.app/UtilityTools

          xcrun otool \
            -arch arm64 \
            -l Payload/UtilityTools.app/UtilityTools | head -80


      # ==========================================
      # 10. 設定執行權限
      # ==========================================

      - name: Set Permissions
        run: |
          chmod 755 Payload/UtilityTools.app/UtilityTools
          chmod 644 Payload/UtilityTools.app/Info.plist
          chmod 644 Payload/UtilityTools.app/PkgInfo


      # ==========================================
      # 11. Ad Hoc / Placeholder Code Sign
      # ==========================================

      - name: Code Sign
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            Payload/UtilityTools.app

          echo "Code signing completed."


      # ==========================================
      # 12. 驗證簽名
      # ==========================================

      - name: Verify Code Signature
        run: |
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            Payload/UtilityTools.app

          echo "Signature verification completed."


      # ==========================================
      # 13. 顯示 App 結構
      # ==========================================

      - name: Inspect App Bundle
        run: |
          echo "===== APP STRUCTURE ====="

          find Payload/UtilityTools.app \
            -maxdepth 2 \
            -print

          echo ""
          echo "===== INFO ====="

          plutil -p \
            Payload/UtilityTools.app/Info.plist


      # ==========================================
      # 14. 建立 IPA
      # ==========================================

      - name: Create IPA
        run: |
          rm -f UtilityTools.ipa

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            UtilityTools.ipa

          test -f UtilityTools.ipa

          echo "IPA created."

          ls -lh UtilityTools.ipa


      # ==========================================
      # 15. 驗證 IPA
      # ==========================================

      - name: Validate IPA
        run: |
          rm -rf ipa_check

          mkdir ipa_check

          unzip -q UtilityTools.ipa \
            -d ipa_check

          test -d ipa_check/Payload/UtilityTools.app

          test -f ipa_check/Payload/UtilityTools.app/Info.plist

          test -f ipa_check/Payload/UtilityTools.app/UtilityTools

          echo ""
          echo "===== IPA CONTENT ====="

          find ipa_check/Payload/UtilityTools.app \
            -maxdepth 1 \
            -print

          echo ""
          echo "IPA validation successful."


      # ==========================================
      # 16. 上傳 IPA
      # ==========================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UtilityTools-IPA
          path: UtilityTools.ipa
          if-no-files-found: error
          retention-days: 30
