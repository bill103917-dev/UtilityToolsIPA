name: Build Real IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create & Build App
        run: |
          # 1. 建立 Swift 原始碼
          mkdir -p TestApp/TestApp
          
          cat << 'EOF' > TestApp/TestApp/TestAppApp.swift
          import SwiftUI

          @main
          struct TestAppApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > TestApp/TestApp/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "star.fill")
                          .font(.system(size: 60))
                          .foregroundColor(.yellow)
                      Text("Hello, iPhone!")
                          .font(.title)
                          .fontWeight(.bold)
                      Text("這是一個真正的 iOS 原生 App！")
                          .font(.body)
                          .foregroundColor(.gray)
                  }
                  .padding()
              }
          }
          EOF

          cat << 'EOF' > TestApp/TestApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.realapp</string>
              <key>CFBundleName</key>
              <string>TestApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 2. 建立完美的 Xcode 專案檔
          mkdir -p TestApp/TestApp.xcodeproj
          cat << 'EOF' > TestApp/TestApp.xcodeproj/project.pbxproj
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              1001 /* TestAppApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = TestAppApp.swift; sourceTree = "<group>"; };
              1002 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
              1003 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
              1004 /* TestApp.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = TestApp.app; sourceTree = BUILT_PRODUCTS_DIR; };
              2001 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = ( 3001 /* TestAppApp.swift in Sources */, 3002 /* ContentView.swift in Sources */, ); runOnlyForDeploymentPostprocessing = 0; };
              2002 /* Frameworks */ = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
              2003 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
              3001 /* TestAppApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = 1001 /* TestAppApp.swift */; };
              3002 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = 1002 /* ContentView.swift */; };
              4001 /* Main Group */ = {isa = PBXGroup; children = ( 4002 /* TestApp */, 4003 /* Products */, ); sourceTree = "<group>"; };
              4002 /* TestApp */ = {isa = PBXGroup; children = ( 1001 /* TestAppApp.swift */, 1002 /* ContentView.swift */, 1003 /* Info.plist */, ); path = TestApp; sourceTree = "<group>"; };
              4003 /* Products */ = {isa = PBXGroup; children = ( 1004 /* TestApp.app */, ); name = Products; sourceTree = "<group>"; };
              5001 /* Native Target */ = {isa = PBXNativeTarget; buildConfigurationList = 6001 /* Build Configurations */; buildPhases = ( 2001 /* Sources */, 2002 /* Frameworks */, 2003 /* Resources */, ); buildRules = (); dependencies = (); name = TestApp; productName = TestApp; productReference = 1004 /* TestApp.app */; productType = "com.apple.product-type.application"; };
              6001 /* Build Configurations */ = {isa = XCConfigurationList; buildConfigurations = ( 6002 /* Release */, ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              6002 /* Release */ = {isa = XCBuildConfiguration; buildSettings = { ALWAYS_SEARCH_USER_PATHS = NO; CLANG_ENABLE_MODULES = YES; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; DEFINES_MODULE = YES; GENERATE_INFOPLIST_FILE = NO; INFOPLIST_FILE = TestApp/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 15.0; PRODUCT_BUNDLE_IDENTIFIER = com.example.realapp; PRODUCT_NAME = TestApp; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
            };
            rootObject = 7001 /* Project Object */;
          }
          EOF

          # 3. 使用 archive 歸檔並繞過簽名檢查
          cd TestApp
          xcodebuild archive \
            -project TestApp.xcodeproj \
            -scheme TestApp \
            -archivePath build/TestApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 4. 解封打包成標準 .ipa
          mkdir -p Payload
          cp -r build/TestApp.xcarchive/Products/Applications/TestApp.app Payload/
          zip -r RealApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: real-ipa-file
          path: TestApp/RealApp.ipa
